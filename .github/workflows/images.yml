name: Images

# Every push to main is a release: the version comes from apps/api/package.json.
# Images get :<version>, :latest and :<sha>, and a GitHub release v<version> is created
# (once per version) for the in-app updater. Bump the version to ship an update.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:modules
      - run: pnpm typecheck
      - run: pnpm exec biome check apps docs
      - run: pnpm test

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./apps/api/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: api_meta
        with:
          images: ghcr.io/aspec-racing-pty-ltd/aspectenant-api
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=
      - uses: docker/metadata-action@v5
        id: web_meta
        with:
          images: ghcr.io/aspec-racing-pty-ltd/aspectenant-web
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
  # Same message as the org's shared discord-deploy-notify workflow. That workflow lives in a
  # private repository, which a public repository cannot call, so the step is inlined here.
  notify:
    name: Discord notification
    if: ${{ always() }}
    needs:
      - check
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RESULT: ${{ needs.publish.result }}
          TITLE: Docker Image Build
          DETAILS: "${{ format('Validation: {0} | Image publish: {1}', needs.check.result, needs.publish.result) }}"
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_DEPLOY_WEBHOOK is not available; skipping the notification."
            exit 0
          fi
          python3 - <<'PY' > /tmp/payload.json
          import json
          import os

          ok = os.environ["RESULT"] == "success"
          fields = [
              {"name": "Repository", "value": os.environ["REPOSITORY"], "inline": False},
              {"name": "Branch", "value": os.environ["BRANCH"], "inline": True},
              {"name": "Commit", "value": os.environ["SHA"][:7], "inline": True},
              {"name": "Triggered by", "value": os.environ["ACTOR"], "inline": True},
          ]
          details = os.environ.get("DETAILS", "").strip()
          if details:
              fields.append({"name": "Details", "value": details[:1024], "inline": False})
          status = "SUCCESS" if ok else "FAILED"
          icon = "✅" if ok else "❌"
          print(json.dumps({
              "username": "GitHub Deployments",
              "embeds": [{
                  "title": f'{icon} {os.environ["TITLE"]} {status}',
                  "color": 5763719 if ok else 15548997,
                  "url": os.environ["RUN_URL"],
                  "fields": fields,
                  "footer": {"text": "GitHub Actions"},
              }],
          }))
          PY
          curl --fail-with-body -H "Content-Type: application/json" -d @/tmp/payload.json "$WEBHOOK"

