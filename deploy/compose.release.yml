name: aspectenant

# Written by install.sh. Re-running the installer refreshes this file and keeps .env.
# Ports come from .env (chosen by the installer to avoid conflicts).

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  updates:
  data:

configs:
  # Same as deploy/postgres/app-role.sql in the repository. Kept inline so this file installs alone.
  db_roles:
    content: |
      -- Creates or updates the role the API connects as. Run by the db-roles service with the
      -- PostgreSQL superuser on every start, so existing volumes are upgraded too.
      --
      -- The application role is not a superuser and cannot bypass row-level security, so the
      -- tenant isolation policies on aspectenant_* tables apply to every API query. It owns the
      -- tables so the API can run its own migrations; FORCE ROW LEVEL SECURITY makes the
      -- policies apply to the owner as well.
      --
      -- Usage: psql -v ON_ERROR_STOP=1 -v app_password=... -f app-role.sql

      SELECT format('CREATE ROLE aspectenant_app LOGIN PASSWORD %L', :'app_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'aspectenant_app')\gexec

      ALTER ROLE aspectenant_app WITH LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE
        PASSWORD :'app_password';

      SELECT format('GRANT CONNECT ON DATABASE %I TO aspectenant_app', current_database())\gexec
      GRANT USAGE, CREATE ON SCHEMA public TO aspectenant_app;

      -- Tables created by earlier releases belong to the superuser. Hand them to the application role.
      DO $$$$
      DECLARE
        r record;
      BEGIN
        FOR r IN
          SELECT c.relname, c.relkind
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r', 'p', 'S', 'v', 'm')
            AND pg_get_userbyid(c.relowner) <> 'aspectenant_app'
            -- Sequences owned by a column move with their table.
            AND NOT (
              c.relkind = 'S'
              AND EXISTS (
                SELECT 1 FROM pg_depend d WHERE d.objid = c.oid AND d.deptype IN ('a', 'i')
              )
            )
        LOOP
          EXECUTE format(
            'ALTER %s public.%I OWNER TO aspectenant_app',
            CASE r.relkind
              WHEN 'S' THEN 'SEQUENCE'
              WHEN 'v' THEN 'VIEW'
              WHEN 'm' THEN 'MATERIALIZED VIEW'
              ELSE 'TABLE'
            END,
            r.relname
          );
        END LOOP;
      END
      $$$$;

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aspec
      POSTGRES_DB: aspec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspec -d aspec"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Creates the non-superuser role the API connects as, so row-level security applies.
  db-roles:
    image: postgres:17.6-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: aspec
      PGDATABASE: aspec
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
    configs:
      - source: db_roles
        target: /app-role.sql
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -v app_password=\"$$APP_DB_PASSWORD\" -f /app-role.sql"]
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${ASPECTENANT_API_IMAGE:-ghcr.io/aspec-racing-pty-ltd/aspectenant-api:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://aspectenant_app:${POSTGRES_APP_PASSWORD}@postgres:5432/aspec
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUSTED_PROXIES: private
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY}
      MAIL_PUBLIC_PORTS: ${ASPECTENANT_MAIL_PORTS:-993,465,587}
    volumes:
      - updates:/updates
      - data:/data
    # Mail apps connect directly (IMAPS, SMTPS, submission). Forward these on your router.
    ports:
      - "${ASPECTENANT_MAIL_BIND:-0.0.0.0}:${ASPECTENANT_IMAPS_PORT:-993}:1993"
      - "${ASPECTENANT_MAIL_BIND:-0.0.0.0}:${ASPECTENANT_SMTPS_PORT:-465}:1465"
      - "${ASPECTENANT_MAIL_BIND:-0.0.0.0}:${ASPECTENANT_SUBMISSION_PORT:-587}:1587"
    networks:
      - internal
    depends_on:
      db-roles:
        condition: service_completed_successfully

  web:
    image: ${ASPECTENANT_WEB_IMAGE:-ghcr.io/aspec-racing-pty-ltd/aspectenant-web:latest}
    restart: unless-stopped
    # Loopback by default so only a local reverse proxy (for example cloudflared) can reach it.
    ports:
      - "${ASPECTENANT_BIND:-127.0.0.1}:${ASPECTENANT_PORT:-8080}:80"
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy

  # Applies updates requested from the Updates page. It only runs
  # "docker compose pull" and "up -d" for api and web. Remove this service to
  # disable in-app updates entirely.
  updater:
    image: docker:28-cli
    restart: unless-stopped
    network_mode: none
    working_dir: ${INSTALL_DIR:-/opt/aspectenant}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${INSTALL_DIR:-/opt/aspectenant}:${INSTALL_DIR:-/opt/aspectenant}
      - updates:/updates
    command:
      - sh
      - -c
      - |
        chown 1000:1000 /updates
        while true; do
          date +%s > /updates/heartbeat
          if [ -f /updates/request ]; then
            rm -f /updates/request
            echo "{\"state\":\"running\",\"at\":$$(date +%s)}" > /updates/status.json
            if { docker compose pull api web && docker compose up -d api web; } > /updates/last.log 2>&1; then r=succeeded; else r=failed; fi
            echo "{\"state\":\"$$r\",\"at\":$$(date +%s)}" > /updates/status.json
            docker image prune -f > /dev/null 2>&1 || true
          fi
          sleep 10
        done
