name: aspectenant

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:

configs:
  db_roles:
    file: ./deploy/postgres/app-role.sql

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aspec
      POSTGRES_DB: aspec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aspec}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    ports:
      - "127.0.0.1:${ASPECTENANT_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspec -d aspec"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Creates the non-superuser role the API connects as, so row-level security applies.
  db-roles:
    image: postgres:17.6-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: aspec
      PGDATABASE: aspec
      PGPASSWORD: ${POSTGRES_PASSWORD:-aspec}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-aspectenant}
    configs:
      - source: db_roles
        target: /app-role.sql
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -v app_password=\"$$APP_DB_PASSWORD\" -f /app-role.sql"]
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: ${ASPECTENANT_API_IMAGE:-aspectenant-api:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://aspectenant_app:${POSTGRES_APP_PASSWORD:-aspectenant}@postgres:5432/aspec
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUSTED_PROXIES: private
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
    networks:
      - internal
    depends_on:
      db-roles:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    image: ${ASPECTENANT_WEB_IMAGE:-aspectenant-web:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ASPECTENANT_PORT:-8080}:80"
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
